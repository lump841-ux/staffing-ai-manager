<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Today — Worker Portal — Only A Job | Staffing Agencies</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="worker-shell">
  <div class="worker-hero">
    <div class="brand-lockup">
      <span class="brand-badge"><img src="/worker/brand-logo.png" alt="Only A Job" /></span>
      <span class="brand-name">Staffing</span>
    </div>
    <div class="worker-hero-row">
      <div class="worker-avatar-wrap">
        <div class="worker-avatar" id="workerAvatar">—</div>
        <label class="worker-avatar-edit" title="Upload photo">
          &#9998;
          <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" />
        </label>
      </div>
      <div>
        <div class="who" id="whoName">—</div>
        <div class="date" id="whoDate"></div>
      </div>
      <button class="btn btn-sm" id="logoutBtn" style="margin-left:auto;">Sign out</button>
    </div>
  </div>

  <div class="worker-body">
    <div id="submittedBanner" class="submitted-banner" style="display:none;">You've submitted today's results. You can still make changes below.</div>
    <p class="error-msg" id="avatarErr"></p>

    <p class="section-label">Today's goal and progress</p>
    <div class="ring-grid" id="ringGrid"></div>

    <div class="panel">
      <p class="panel-title">Submit daily results</p>
      <form id="submitForm"></form>
      <div class="field">
        <label>Notes</label>
        <textarea id="notes" rows="2" placeholder="Anything worth noting about today"></textarea>
      </div>
      <div class="field">
        <label>Problems or obstacles</label>
        <textarea id="obstacles" rows="2" placeholder="Anything that got in the way today"></textarea>
      </div>
      <p class="error-msg" id="submitErr"></p>
      <button class="btn btn-primary btn-block" id="submitBtn">Submit daily results</button>
    </div>

    <div class="panel">
      <p class="panel-title">Complete an activity — upload photo proof</p>
      <div class="field">
        <label>Activity</label>
        <select id="proofActivitySelect"></select>
      </div>
      <div class="field" id="proofCustomTitleField" style="display:none;">
        <label>Describe the activity</label>
        <input id="proofCustomTitle" placeholder="e.g. Site walkthrough with client" />
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <textarea id="proofNote" rows="2" placeholder="Anything the manager should know"></textarea>
      </div>
      <div class="field">
        <label>Photo proof</label>
        <input type="file" id="proofPhotoInput" accept="image/*" capture="environment" />
      </div>
      <img id="proofPreview" style="display:none;max-width:100%;border-radius:var(--r-md);margin-bottom:10px;" />
      <p class="error-msg" id="proofErr"></p>
      <button class="btn btn-primary btn-block" id="proofSubmitBtn">Mark Complete &amp; Submit</button>
    </div>

    <div class="panel">
      <p class="panel-title">Your recent submissions</p>
      <div id="proofHistory"><p class="empty">Loading…</p></div>
    </div>
  </div>
</div>

<script>
let categories = [];

function ringSVG(pct, size) {
  const r = (size - 8) / 2;
  const c = size / 2;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - Math.min(1, pct));
  const color = pct >= 1 ? '#0f9d58' : pct >= 0.6 ? '#2a5bd7' : '#d92d20';
  return `<svg class="ring-svg" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#eaecf0" stroke-width="7" />
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 ${c} ${c})" />
    <text x="${c}" y="${c + 5}" text-anchor="middle" font-size="15" font-weight="700" fill="#101828">${Math.round(pct * 100)}%</text>
  </svg>`;
}

function renderAvatar(name, avatarUrl) {
  const el = document.getElementById('workerAvatar');
  if (avatarUrl) {
    el.innerHTML = `<img src="${avatarUrl}" alt="${name}" />`;
  } else {
    const initials = (name || '?').trim().split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();
    el.textContent = initials || '?';
  }
}

async function loadMe() {
  const res = await fetch('/api/auth/me');
  if (!res.ok) { window.location.href = '/worker/login.html'; return; }
  const me = await res.json();
  document.getElementById('whoName').textContent = me.name;
  document.getElementById('whoDate').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  renderAvatar(me.name, me.avatarUrl);
}

// Resize/compress the chosen photo client-side (max 320px, JPEG ~0.8 quality)
// before sending, so uploads stay well under the server's 900kb cap and the
// 2mb JSON body limit — no library needed, just a canvas.
function fileToCompressedDataUrl(file, maxSize = 320, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.onload = () => { img.src = reader.result; };
    img.onerror = () => reject(new Error('Could not read that image.'));
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) { height = Math.round(height * (maxSize / width)); width = maxSize; }
      else if (height > maxSize) { width = Math.round(width * (maxSize / height)); height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('avatarInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const errEl = document.getElementById('avatarErr');
  errEl.textContent = '';
  try {
    const dataUrl = await fileToCompressedDataUrl(file);
    const res = await fetch('/api/worker/avatar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataUrl }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Upload failed'; return; }
    renderAvatar(document.getElementById('whoName').textContent, data.avatarUrl);
  } catch (err) {
    errEl.textContent = err.message || 'Upload failed';
  }
  e.target.value = '';
});

async function loadToday() {
  const res = await fetch('/api/worker/today');
  const data = await res.json();
  categories = data.categories;

  document.getElementById('submittedBanner').style.display = data.alreadySubmitted ? 'block' : 'none';
  document.getElementById('notes').value = data.notes || '';
  document.getElementById('obstacles').value = data.obstacles || '';

  const ringGrid = document.getElementById('ringGrid');
  ringGrid.innerHTML = '';
  for (const c of categories) {
    const val = c.value != null ? c.value : 0;
    const pct = c.target > 0 ? val / c.target : 0;
    const card = document.createElement('div');
    card.className = 'ring-card';
    card.innerHTML = `${ringSVG(pct, 76)}<p class="ring-label">${c.label}</p><p class="ring-value">${val} / ${c.target || '—'}</p>`;
    ringGrid.appendChild(card);
  }

  const form = document.getElementById('submitForm');
  form.innerHTML = '';
  for (const c of categories) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.innerHTML = `<label>${c.label}</label><input type="number" min="0" step="1" data-cat="${c.id}" value="${c.value != null ? c.value : ''}" placeholder="0" />`;
    form.appendChild(wrap);
  }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/worker/login.html';
});

document.getElementById('submitBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('submitErr');
  errEl.textContent = '';
  const values = {};
  let hasError = false;
  document.querySelectorAll('#submitForm input[data-cat]').forEach((input) => {
    const v = input.value === '' ? 0 : Number(input.value);
    if (!Number.isFinite(v) || v < 0) hasError = true;
    values[input.dataset.cat] = v;
  });
  if (hasError) { errEl.textContent = 'Enter valid non-negative numbers for each category.'; return; }

  const res = await fetch('/api/worker/submit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      values,
      notes: document.getElementById('notes').value,
      obstacles: document.getElementById('obstacles').value,
    }),
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Submit failed'; return; }
  await loadToday();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ---- Photo proof of completed activity ----
const PROOF_STATUS_PILL = {
  pending_verification: '<span class="pill amber">Pending Verification</span>',
  verified: '<span class="pill green">Verified</span>',
  needs_review: '<span class="pill red">Needs Review</span>',
};

function populateProofActivitySelect() {
  const select = document.getElementById('proofActivitySelect');
  const options = categories.map((c) => `<option value="${c.id}">${c.label}</option>`).join('');
  select.innerHTML = options + '<option value="">Other (describe below)</option>';
  toggleProofCustomTitle();
}

function toggleProofCustomTitle() {
  const select = document.getElementById('proofActivitySelect');
  document.getElementById('proofCustomTitleField').style.display = select.value === '' ? 'block' : 'none';
}
document.getElementById('proofActivitySelect').addEventListener('change', toggleProofCustomTitle);

let selectedProofPhoto = null;
document.getElementById('proofPhotoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const errEl = document.getElementById('proofErr');
  errEl.textContent = '';
  if (!file) return;
  try {
    selectedProofPhoto = await fileToCompressedDataUrl(file, 640, 0.82);
    const preview = document.getElementById('proofPreview');
    preview.src = selectedProofPhoto;
    preview.style.display = 'block';
  } catch (err) {
    errEl.textContent = err.message || 'Could not read that photo.';
  }
});

document.getElementById('proofSubmitBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('proofErr');
  errEl.textContent = '';
  const select = document.getElementById('proofActivitySelect');
  const categoryId = select.value || null;
  const category = categories.find((c) => String(c.id) === String(categoryId));
  const title = category ? category.label : document.getElementById('proofCustomTitle').value.trim();
  const note = document.getElementById('proofNote').value.trim();

  if (!title) { errEl.textContent = 'Choose an activity or describe what you completed.'; return; }
  if (!selectedProofPhoto) { errEl.textContent = 'Take or upload a photo as proof.'; return; }

  const res = await fetch('/api/worker/activity-proofs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, categoryId, note, photoDataUrl: selectedProofPhoto }),
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Submit failed'; return; }

  selectedProofPhoto = null;
  document.getElementById('proofPhotoInput').value = '';
  document.getElementById('proofPreview').style.display = 'none';
  document.getElementById('proofNote').value = '';
  document.getElementById('proofCustomTitle').value = '';
  loadProofHistory();
});

async function loadProofHistory() {
  const res = await fetch('/api/worker/activity-proofs');
  const rows = await res.json();
  const el = document.getElementById('proofHistory');
  el.innerHTML = rows.length
    ? rows.map((p) => `
      <div class="discrepancy-row" style="display:block;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            <div class="who">${p.title} — <span style="font-weight:400;">COMPLETED</span></div>
            <div class="why">Submitted: ${new Date(p.submitted_at).toLocaleString(undefined, { hour: 'numeric', minute: '2-digit', month: 'short', day: 'numeric' })}${p.note ? '<br/>Note: ' + p.note : ''}${p.review_comment ? '<br/>Manager: ' + p.review_comment : ''}</div>
          </div>
          ${PROOF_STATUS_PILL[p.status] || ''}
        </div>
        <a href="${p.photo_data_url}" target="_blank" style="font-size:13px;">Photo Proof: View Photo</a>
      </div>`).join('')
    : '<p class="empty">No completed activities submitted yet.</p>';
}

loadMe();
loadToday().then(() => { populateProofActivitySelect(); loadProofHistory(); });
</script>
</body>
</html>
