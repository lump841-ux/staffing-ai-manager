<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Worker sign in — Staffing AI Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">Worker Portal</div>
    <h1>Sign in</h1>
    <p class="sub">Submit your daily numbers and see today's progress.</p>
    <p class="error-msg" id="err"></p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <div class="demo-hint">
      Demo worker logins:<br />
      sarah.chen@summitstaffing.demo / worker123<br />
      david.kim@summitstaffing.demo / worker123<br />
      maria.lopez@summitstaffing.demo / worker123<br /><br />
      Manager sign in is at <a href="/manager/login.html">/manager/login.html</a>.
    </div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Sign in failed'; return; }
    if (data.user.role !== 'worker') { errEl.textContent = 'This account is not a worker account.'; return; }
    window.location.href = '/dashboard/worker';
  } catch (err) {
    errEl.textContent = 'Could not reach the server.';
  }
});
</script>
</body>
</html>
