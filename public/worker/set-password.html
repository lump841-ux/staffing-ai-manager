<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Set recruiter password — Twanova | Staffing Solutions</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
</head>
<body>
<div class="auth-shell worker-auth">
  <div class="auth-card">
    <div class="auth-brand-lockup">
      <img src="/worker/brand-logo-full.png" alt="Twanova — Staffing Solutions" style="height:40px;width:auto;" />
    </div>
    <div class="auth-brand">Recruiter Access</div>
    <h1 id="title">Set your password</h1>
    <p class="sub" id="intro">Checking your secure setup link…</p>
    <p class="error-msg" id="err"></p>
    <form id="passwordForm" style="display:none;">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" disabled />
      </div>
      <div class="field">
        <label>New password</label>
        <input type="password" id="password" minlength="8" required autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Save password</button>
    </form>
    <div id="success" style="display:none;">
      <p>Your password is set. You can now sign in to the recruiter portal.</p>
      <a class="btn btn-primary btn-block" href="/worker/login.html">Go to recruiter sign in</a>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const errEl = document.getElementById('err');
const form = document.getElementById('passwordForm');

async function verifyToken() {
  if (!token) {
    errEl.textContent = 'This setup link is missing its security token.';
    document.getElementById('intro').textContent = 'Ask your manager to generate a new access link.';
    return;
  }
  try {
    const res = await fetch('/api/auth/worker-access?token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'This setup link is not valid.';
      document.getElementById('intro').textContent = 'Ask your manager to generate a new access link.';
      return;
    }
    document.getElementById('email').value = data.worker.email;
    document.getElementById('title').textContent = data.purpose === 'invite' ? 'Create your password' : 'Reset your password';
    document.getElementById('intro').textContent = 'Welcome, ' + data.worker.name + '. Choose a private password for your Twanova recruiter account.';
    form.style.display = 'block';
  } catch (e) {
    errEl.textContent = 'Could not verify this setup link.';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if (password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    return;
  }
  if (password !== confirmPassword) {
    errEl.textContent = 'The passwords do not match.';
    return;
  }
  const res = await fetch('/api/auth/worker-set-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password }),
  });
  const data = await res.json();
  if (!res.ok) {
    errEl.textContent = data.error || 'Could not set your password.';
    return;
  }
  form.style.display = 'none';
  document.getElementById('intro').style.display = 'none';
  document.getElementById('success').style.display = 'block';
});

verifyToken();
</script>
</body>
</html>
