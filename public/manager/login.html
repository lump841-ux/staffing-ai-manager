<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Manager sign in — Only A Job | Staffing Agencies</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand-lockup">
      <img src="/manager/logo.png" alt="Only A Job" />
      <div class="brand-text">
        <span class="brand-name">Only A Job</span>
        <span class="brand-sub">Staffing Agencies</span>
      </div>
    </div>
    <div class="auth-brand">Manager Command Center</div>
    <h1>Sign in</h1>
    <p class="sub">Your branch, at a glance.</p>
    <p class="error-msg" id="err"></p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" value="manager@summitstaffing.demo" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" value="manager123" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <div class="demo-hint">
      Demo manager login is pre-filled above.<br /><br />
      Worker sign in is at <a href="/worker/login.html">/worker/login.html</a>.
    </div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Sign in failed'; return; }
    if (data.user.role !== 'manager' && data.user.role !== 'owner') { errEl.textContent = 'This account is not a manager account.'; return; }
    window.location.href = '/dashboard/manager';
  } catch (err) {
    errEl.textContent = 'Could not reach the server.';
  }
});
</script>
</body>
</html>
