<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Super Admin sign in — Only A Job</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">Only A Job Platform</div>
    <h1>Super Admin</h1>
    <p class="sub">Platform operator access only — not for staffing agencies.</p>
    <p class="error-msg" id="err"></p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="username" /></div>
      <div class="field"><label>Password</label><input type="password" id="password" required autocomplete="current-password" /></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  const res = await fetch('/api/platform-admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Sign in failed'; return; }
  window.location.href = '/platform-admin/dashboard.html';
});
</script>
</body>
</html>
