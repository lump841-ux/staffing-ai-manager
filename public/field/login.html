<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Temp sign in — Twanova | Staffing Solutions</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="shortcut icon" href="/favicon.ico" />
</head>
<body>
<div class="auth-shell worker-auth">
  <div class="auth-card">
    <div class="auth-brand-lockup">
      <img src="/worker/brand-logo-full.png" alt="Twanova — Staffing Solutions" style="height:40px;width:auto;" />
    </div>
    <div class="auth-brand">Temp Portal</div>
    <h1>Sign in</h1>
    <p class="sub">See today's assignment and let your agency and client know what's going on.</p>
    <p class="error-msg" id="err"></p>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <div class="demo-hint">
      Your staffing agency sets up this login and gives you your credentials directly —
      there's no self sign-up here. Not a temp? The recruiter portal is at
      <a href="/worker/login.html">/worker/login.html</a>.
    </div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Sign in failed'; return; }
    if (data.user.role !== 'field_worker') { errEl.textContent = 'This account is not a temp account.'; return; }
    window.location.href = '/dashboard/field';
  } catch (err) {
    errEl.textContent = 'Could not reach the server.';
  }
});
</script>
</body>
</html>
